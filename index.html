
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Tree Clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <button id="menuButton">☰ Boutique</button>

        <h1>🌸 CHERRY TREE CLICKER</h1>

        <div class="clickCounter">
            🖱️ <span id="clickCount">0</span> clics
        </div>
    </header>

    <!-- Boutique -->
    <aside id="shop">

        <button id="closeShop">✕</button>

        <h2>🌸 Boutique des arbres</h2>

        <p>Débloque de nouveaux arbres avec tes clics !</p>

        <div id="treeShop"></div>

    </aside>

    <!-- Jeu -->
    <main>

        <section id="game">

            <div id="treeArea">

                <div id="trunk"></div>

                <div id="branch"></div>

                <div id="flowerBush"></div>

                <div id="sapContainer"></div>

            </div>

            <div id="instructions">
                Clique sur ton arbre pour gagner des clics !
            </div>

        </section>

    </main>

</body>
</html>
